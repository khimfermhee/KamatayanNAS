<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KamatayanNAS Files</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.jpg">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <!-- Background Decoration -->
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>

    <!-- Login View -->
    <div id="login-view" class="view active">
        <div class="glass-panel login-panel">
            <div class="logo">
                <img src="logo.jpg" alt="KamatayanNAS Logo" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 1rem; border: 2px solid var(--primary-color); box-shadow: 0 0 20px rgba(88,166,255,0.4);">
                <h2>KamatayanNAS</h2>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Username" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn primary-btn">Login <i class="fas fa-arrow-right"></i></button>
            </form>
            <div id="login-error" class="error-msg"></div>
        </div>
    </div>

    <!-- Main App View -->
    <div id="app-view" class="view">
        <header class="glass-header">
            <div class="header-left">
                <button id="btn-home" class="icon-btn"><i class="fas fa-home"></i></button>
                <div id="breadcrumbs" class="breadcrumbs"></div>
            </div>
            <div class="header-right">
                <button id="btn-menu" class="icon-btn mobile-only"><i class="fas fa-bars"></i></button>
                <div id="nav-actions" class="nav-actions">
                    <span id="meta-progress" class="hidden" style="font-size: 0.8rem; color: var(--text-muted); white-space: nowrap;">Loading data...</span>
                    <select id="sort-select" class="btn outline-btn" style="padding: 0.4rem; font-size: 0.85rem;">
                        <option value="name_asc">Name (A-Z)</option>
                        <option value="name_desc">Name (Z-A)</option>
                        <option value="date_desc">Newest</option>
                        <option value="date_asc">Oldest</option>
                        <option value="size_desc">Largest</option>
                        <option value="size_asc">Smallest</option>
                    </select>
                    <button id="btn-admin" class="btn outline-btn hidden"><i class="fas fa-users-cog"></i> Admin</button>
                    <button id="btn-logout" class="icon-btn"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </header>

        <main class="content-area">
            <div id="file-grid" class="file-grid">
                <!-- File items injected here by JS -->
            </div>
            <div id="scroll-sentinel" style="height: 1px; width: 100%;"></div>
            <div id="loading-spinner" class="spinner hidden"><i class="fas fa-circle-notch fa-spin"></i></div>
            <div id="empty-state" class="empty-state hidden">
                <i class="fas fa-folder-open"></i>
                <p>This folder is empty.</p>
            </div>
        </main>
    </div>

    <!-- Admin Dashboard Modal -->
    <div id="admin-modal" class="modal hidden">
        <div class="glass-panel modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-users-cog"></i> Account Management</h3>
                <button class="close-modal icon-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <div class="user-list-container">
                    <h4>Current Users</h4>
                    <ul id="user-list" class="user-list"></ul>
                </div>
                <div class="add-user-container">
                    <h4>Add New User</h4>
                    <form id="add-user-form">
                        <input type="text" id="new-username" placeholder="Username" required>
                        <input type="password" id="new-password" placeholder="Password" required>
                        <select id="new-role">
                            <option value="user">User</option>
                            <option value="admin">Admin</option>
                        </select>
                        <button type="submit" class="btn primary-btn"><i class="fas fa-plus"></i> Add User</button>
                    </form>
                    <div id="admin-msg" class="msg"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Media Lightbox -->
    <div id="lightbox" class="lightbox hidden">
        <button class="close-lightbox icon-btn"><i class="fas fa-times"></i></button>
        <div class="lightbox-content" id="lightbox-content">
            <!-- Media injected here -->
        </div>
        <div class="lightbox-controls">
            <button id="lb-prev" class="icon-btn"><i class="fas fa-chevron-left"></i></button>
            <div id="lb-info" class="lb-info"></div>
            <button id="lb-next" class="icon-btn"><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu hidden">
        <ul>
            <li id="ctx-view"><i class="fas fa-eye"></i> View/Play</li>
            <li id="ctx-copy"><i class="fas fa-copy"></i> Copy...</li>
            <li id="ctx-delete" class="danger"><i class="fas fa-trash"></i> Delete</li>
        </ul>
    </div>
    
    <!-- Copy Dialog -->
    <div id="copy-modal" class="modal hidden">
        <div class="glass-panel modal-content small">
            <div class="modal-header">
                <h3>Copy File</h3>
                <button class="close-copy icon-btn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <p>Copying: <span id="copy-source-name"></span></p>
                <input type="text" id="copy-dest-path" placeholder="Destination Path (e.g. Folder/name.ext)" required>
                <button id="confirm-copy-btn" class="btn primary-btn mt-1">Copy</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
